name: CMA source snapshot for logo correction
on:
  push:
    branches: [cma-host-20260921]
    paths: [.github/workflows/cma-source-snapshot-v7.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: cma-source-v7-edit
          path: cma-host/
          retention-days: 1
          if-no-files-found: error
