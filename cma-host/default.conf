server {
    listen 80;
    listen [::]:80;
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-CMA-Build studio-polish-seo-v6-20260922 always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location /media/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /build-manifest.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location /__qa/ {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex";
        try_files $uri =404;
    }
    location ~ ^/downloads/.*\.zip$ {
        add_header Content-Disposition 'attachment; filename="CMA-website-v6.zip"';
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex";
        try_files $uri =404;
    }
    location /downloads/ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
